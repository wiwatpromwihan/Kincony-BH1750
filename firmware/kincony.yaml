# =========================================================
# เลือกโหมดใหม่ (ยังไม่ commit) + ปุ่มทดสอบ + ปุ่มยืนยัน (ข้อกำหนดที่ 3-4)
# =========================================================
select:
  - platform: template
    name: "AC209 Select Mode (Pending)"
    id: candidate_mode_select
    optimistic: true
    options:
      - "Light Mode (BH1750)"
      - "Battery Mode (Mijia)"
    initial_option: "Light Mode (BH1750)"
    on_value:
      then:
        - lambda: |-
            if (x == "Light Mode (BH1750)") {
              id(pending_mode) = 0;
            } else if (x == "Battery Mode (Mijia)") {
              id(pending_mode) = 1;
            }

button:
  - platform: template
    name: "AC209 Test Alert Pattern"
    id: btn_test_pattern
    on_press:
      then:
        - script.execute: test_pattern

  - platform: template
    name: "AC209 Confirm Selected Mode"
    id: btn_confirm_mode
    on_press:
      then:
        - script.execute: confirm_mode_change

  - platform: restart
    name: "AC209 Restart"

# GPIO18 is the SPI SCK pin (shared with the optional LoRa/nRF24L01 header).
# It's free — this board has no onboard buzzer, so nothing else uses it.
# If you solder on an external passive buzzer later, the old ledc+rtttl
# setup can go back in (just don't use LoRa/nRF24L01 at the same time).

# =========================================================
# CLICK PATTERNS ("sound effects" using relay clicks)
# relay_1/relay_2 double as the "click" channels for single-tone alerts;
# MELODY marches through all 6 in sequence for a fun little run. Timings
# are short (60-150ms) to keep it snappy and limit wear on the relay
# contacts. mode: restart means a new pattern interrupts whatever's
# currently playing, same as rtttl.stop + rtttl.play did before.
#
# ด้านล่างนี้เป็นสคริปต์ชุดเดิม (สำหรับคำสั่งผ่าน MQTT sound/play) รวมกับ
# สคริปต์ชุดใหม่ที่ใช้กับ automation ของ BH1750 / Mijia / mode-switch
# ตามข้อกำหนดที่ 3-4 ของงาน
#
# หมายเหตุการออกแบบ (ใหม่): จงใจ "ไม่" ผูก http_request ไปยัง Firebase
# ไว้ที่ relay switch โดยตรง (เช่น on_turn_on/on_turn_off) เพราะรูปแบบ
# เสียง/แจ้งเตือนพวกนี้กระพริบ relay รัว ๆ ทุก 60-150ms — ถ้ายิง HTTPS
# request ทุกครั้งที่ relay ติด/ดับจะ (1) หน่วงจังหวะการกระพริบเพราะ
# HTTPS ใช้เวลาจริงกว่า delay() ที่ตั้งไว้มาก (2) ยิง request ไป Firebase
# รัว ๆ โดยไม่มีประโยชน์ (ไม่มีใครต้องดู log ทุกจังหวะของเสียง "บี๊บ")
# จึงให้ Firebase อ่านสถานะ relay ปัจจุบันตอนสร้าง snapshot ตามรอบเวลา
# แทน (ดู interval: ท้ายไฟล์) ซึ่งอ่านสถานะ relay ตอนนั้นจริง ๆ
# (หลังรูปแบบเสียงเล่นจบแล้วเสมอ เพราะทุก pattern ใช้เวลา <2 วินาที)
# =========================================================
script:
  # ---------------------------------------------------------
  # ยิงค่าที่อ่านได้จาก Mijia แต่ละตัวออกไปเป็น MQTT JSON หนึ่งชุดต่อการ
  # อ่านหนึ่งรอบ (running_number/mac_address/temp/humi/batt/datetime)
  # topic: pkru/kc868_a6_01/209-219/mijia/<mac>/data — เหมือนเดิมทุก
  # ประการ (ระบบเก่ายังอยู่ครบ) แล้วเพิ่มการอัปเดต
  # mijia_last_seen[running_number-1] = millis() (ใช้เช็คออนไลน์/ออฟไลน์
  # ทั้งใน text_sensor และใน snapshot ที่ส่งไป Firebase)
  # ---------------------------------------------------------
  - id: publish_bthome_mqtt
    parameters:
      running_number: int
      mac: string
      temp: float
      humi: float
      batt: int
    then:
      - mqtt.publish_json:
          topic: !lambda |-
            return std::string("pkru/kc868_a6_01/209-219/mijia/") + mac + "/data";
          payload: |-
            root["running_number"] = running_number;
            root["mac_address"] = mac;
            root["temp"] = temp;
            root["humi"] = humi;
            root["batt"] = batt;
            root["datetime"] = id(sntp_time).now().strftime("%Y-%m-%d %H:%M:%S");
      - lambda: |-
          id(mijia_last_seen)[running_number - 1] = millis();

  # ---------------------------------------------------------
  # FIREBASE: สร้าง JSON snapshot ก้อนเดียวของทั้งระบบ เก็บไว้ใน
  # fb_payload (ใช้ร่วมกันทั้ง latest และ history จะได้ตรงกันเป๊ะ)
  # ---------------------------------------------------------
  - id: build_firebase_payload
    then:
      - lambda: |-
          const uint32_t OFFLINE_MS = 300000;   // Mijia เงียบเกิน 5 นาที = ออฟไลน์
          auto now = id(sntp_time).now();
          uint32_t ms = millis();

          JsonDocument doc;
          JsonObject root = doc.to<JsonObject>();

          // ---- เวลา (เวลาจริง Asia/Bangkok จาก SNTP) ----
          root["device"] = "esp32-209-224";
          root["datetime"] = now.strftime("%Y-%m-%d %H:%M:%S");
          root["timezone"] = "Asia/Bangkok";
          root["timestamp"] = (uint32_t) now.timestamp;
          root["server_time"][".sv"] = "timestamp";   // Firebase เติมเวลาฝั่ง server ให้

          // ---- บอร์ด / โหมด / relay ----
          JsonObject board = root["board"].to<JsonObject>();
          board["online"] = true;
          board["uptime_s"] = ms / 1000;
          board["mode_active"] = id(active_mode_text).state;
          board["mode_pending"] = id(candidate_mode_select).current_option().str();
          JsonObject relay = board["relay"].to<JsonObject>();
          relay["relay_1"] = id(relay_1).state;
          relay["relay_2"] = id(relay_2).state;
          relay["relay_3"] = id(relay_3).state;
          relay["relay_4"] = id(relay_4).state;
          relay["relay_5"] = id(relay_5).state;
          relay["relay_6"] = id(relay_6).state;

          // ---- แสง BH1750 ----
          JsonObject light = root["light"].to<JsonObject>();
          float lux = id(light_sensor).state;
          bool light_value_available = std::isfinite(lux);
          bool light_ok = light_value_available && id(light_unstable_streak) < 3;
          if (light_value_available) light["lux"] = roundf(lux * 10) / 10;
          light["healthy"] = light_ok;
          light["status"] = !light_value_available
              ? "ไม่มีข้อมูลจาก BH1750 (ตรวจสอบการต่อ I2C/เซนเซอร์)"
              : (light_ok ? "ทำงานปกติ" : "ค่าผิดปกติ (ตรวจสอบ BH1750)");

          // ---- Mijia 1-10 ----
          static const char *const MACS[10] = {
            "A4:C1:38:14:C1:83", "A4:C1:38:BD:50:F9", "A4:C1:38:8F:16:38",
            "A4:C1:38:17:09:4D", "A4:C1:38:FC:63:78", "A4:C1:38:7A:E3:D1",
            "A4:C1:38:20:0F:B6", "A4:C1:38:70:64:10", "A4:C1:38:33:03:B0",
            "A4:C1:38:62:BF:D3"};
          sensor::Sensor *T[10] = {id(temp_1), id(temp_2), id(temp_3), id(temp_4), id(temp_5),
                                   id(temp_6), id(temp_7), id(temp_8), id(temp_9), id(temp_10)};
          sensor::Sensor *H[10] = {id(humi_1), id(humi_2), id(humi_3), id(humi_4), id(humi_5),
                                   id(humi_6), id(humi_7), id(humi_8), id(humi_9), id(humi_10)};
          sensor::Sensor *B[10] = {id(batt_1), id(batt_2), id(batt_3), id(batt_4), id(batt_5),
                                   id(batt_6), id(batt_7), id(batt_8), id(batt_9), id(batt_10)};

          JsonObject mijia = root["mijia"].to<JsonObject>();
          int online_count = 0;
          for (int i = 0; i < 10; i++) {
            char key[10];
            snprintf(key, sizeof(key), "mijia_%02d", i + 1);
            JsonObject m = mijia[key].to<JsonObject>();
            m["mac"] = MACS[i];

            uint32_t last = id(mijia_last_seen)[i];
            bool online = (last != 0) && (ms - last <= OFFLINE_MS);
            if (online) online_count++;
            m["online"] = online;
            m["status"] = (last == 0) ? "ยังไม่พบสัญญาณ" : (online ? "ออนไลน์" : "ออฟไลน์");

            if (last != 0) {
              // เวลาจริงที่ได้รับสัญญาณล่าสุด = เวลาตอนนี้ - (ผ่านไปกี่วินาที)
              time_t seen = now.timestamp - (time_t) ((ms - last) / 1000);
              m["last_seen"] = ESPTime::from_epoch_local(seen).strftime("%Y-%m-%d %H:%M:%S");
              if (!std::isnan(T[i]->state)) m["temp"] = roundf(T[i]->state * 10) / 10;
              if (!std::isnan(H[i]->state)) m["humi"] = roundf(H[i]->state);
              if (!std::isnan(B[i]->state)) m["batt"] = (int) B[i]->state;
            }
          }

          // ---- สรุปภาพรวม ----
          JsonObject summary = root["summary"].to<JsonObject>();
          summary["mijia_online"] = online_count;
          summary["mijia_total"] = 10;
          summary["light_healthy"] = light_ok;

          id(fb_payload).clear();
          serializeJson(doc, id(fb_payload));

  # ค่าล่าสุด: PUT ทับ lab/esp32-209-224/latest.json
  - id: firebase_push_latest
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(sntp_time).now().is_valid();'
          then:
            - script.execute: build_firebase_payload
            - http_request.send:
                method: PUT
                url: "${firebase_url}/${firebase_path}/latest.json"
                request_headers:
                  Content-Type: application/json
                body: !lambda 'return id(fb_payload);'
          else:
            - logger.log: "Firebase latest: รอ SNTP sync เวลาก่อน"

  # ประวัติ: POST ต่อท้าย lab/esp32-209-224/history.json (1 แถว/ครั้ง)
  - id: firebase_push_history
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(sntp_time).now().is_valid();'
          then:
            - script.execute: build_firebase_payload
            - http_request.send:
                method: POST
                url: "${firebase_url}/${firebase_path}/history.json"
                request_headers:
                  Content-Type: application/json
                body: !lambda 'return id(fb_payload);'
          else:
            - logger.log: "Firebase history: รอ SNTP sync เวลาก่อน"

  - id: click_beep
    mode: restart
    then:
      - switch.turn_on: relay_1
      - delay: 60ms
      - switch.turn_off: relay_1

  - id: click_success
    mode: restart
    then:
      - switch.turn_on: relay_1
      - delay: 80ms
      - switch.turn_off: relay_1
      - delay: 80ms
      - switch.turn_on: relay_2
      - delay: 80ms
      - switch.turn_off: relay_2

  - id: click_warning
    mode: restart
    then:
      - repeat:
          count: 3
          then:
            - switch.turn_on: relay_1
            - delay: 150ms
            - switch.turn_off: relay_1
            - delay: 150ms

  - id: click_alarm
    mode: restart
    then:
      - repeat:
          count: 8
          then:
            - switch.turn_on: relay_1
            - delay: 80ms
            - switch.turn_off: relay_1
            - delay: 80ms

  - id: click_melody
    mode: restart
    then:
      - switch.turn_on: relay_1
      - delay: 100ms
      - switch.turn_off: relay_1
      - delay: 60ms
      - switch.turn_on: relay_2
      - delay: 100ms
      - switch.turn_off: relay_2
      - delay: 60ms
      - switch.turn_on: relay_3
      - delay: 100ms
      - switch.turn_off: relay_3
      - delay: 60ms
      - switch.turn_on: relay_4
      - delay: 100ms
      - switch.turn_off: relay_4
      - delay: 60ms
      - switch.turn_on: relay_5
      - delay: 100ms
      - switch.turn_off: relay_5
      - delay: 60ms
      - switch.turn_on: relay_6
      - delay: 100ms
      - switch.turn_off: relay_6

  # ---------------------------------------------------------
  # แสงต่ำกว่า 50 lux → เตือน "1 จังหวะ" ไล่จาก relay1 ถึง relay3
  # ---------------------------------------------------------
  - id: light_alert_low
    mode: restart
    then:
      - switch.turn_on: relay_1
      - delay: 100ms
      - switch.turn_off: relay_1
      - delay: 60ms
      - switch.turn_on: relay_2
      - delay: 100ms
      - switch.turn_off: relay_2
      - delay: 60ms
      - switch.turn_on: relay_3
      - delay: 100ms
      - switch.turn_off: relay_3

  # ---------------------------------------------------------
  # แสงมากกว่า 90 lux → เตือน "2 จังหวะ" ไล่จาก relay6 ถึง relay4
  # ---------------------------------------------------------
  - id: light_alert_high
    mode: restart
    then:
      - repeat:
          count: 2
          then:
            - switch.turn_on: relay_6
            - delay: 100ms
            - switch.turn_off: relay_6
            - delay: 60ms
            - switch.turn_on: relay_5
            - delay: 100ms
            - switch.turn_off: relay_5
            - delay: 60ms
            - switch.turn_on: relay_4
            - delay: 100ms
            - switch.turn_off: relay_4
            - delay: 200ms

  # ---------------------------------------------------------
  # แบตของ Mijia ตัวที่ n ลดลง 1 หน่วย → ไล่คลิก relay1 ถึง relayN ตามลำดับ
  # ตัวอย่าง: เซนเซอร์ตัวที่ 1 ลด → คลิกแค่ relay1 (1 ครั้ง)
  #           เซนเซอร์ตัวที่ 5 ลด → ไล่คลิก relay1,2,3,4,5 ตามลำดับ
  # mode: queued กันไม่ให้สัญญาณของเซนเซอร์ตัวหนึ่งไปตัดจังหวะของอีกตัว
  # ---------------------------------------------------------
  - id: battery_alert_seq
    mode: queued
    parameters:
      n: int
    then:
      - if:
          condition:
            lambda: 'return n >= 1;'
          then:
            - switch.turn_on: relay_1
            - delay: 120ms
            - switch.turn_off: relay_1
            - delay: 80ms
      - if:
          condition:
            lambda: 'return n >= 2;'
          then:
            - switch.turn_on: relay_2
            - delay: 120ms
            - switch.turn_off: relay_2
            - delay: 80ms
      - if:
          condition:
            lambda: 'return n >= 3;'
          then:
            - switch.turn_on: relay_3
            - delay: 120ms
            - switch.turn_off: relay_3
            - delay: 80ms
      - if:
          condition:
            lambda: 'return n >= 4;'
          then:
            - switch.turn_on: relay_4
            - delay: 120ms
            - switch.turn_off: relay_4
            - delay: 80ms
      - if:
          condition:
            lambda: 'return n >= 5;'
          then:
            - switch.turn_on: relay_5
            - delay: 120ms
            - switch.turn_off: relay_5
            - delay: 80ms
      - if:
          condition:
            lambda: 'return n >= 6;'
          then:
            - switch.turn_on: relay_6
            - delay: 120ms
            - switch.turn_off: relay_6
            - delay: 80ms

  # ---------------------------------------------------------
  # ทดสอบ/พรีวิวรูปแบบการแจ้งเตือนของโหมดที่ "เลือกไว้แต่ยังไม่ยืนยัน"
  # (pending_mode) — ไม่แตะ relay_mode จริง ไม่กระทบการทำงานปกติ
  # ---------------------------------------------------------
  - id: test_pattern
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(pending_mode) == 0;'
          then:
            - logger.log: "Preview: light-mode pattern (low → high)"
            - script.execute: light_alert_low
            - delay: 500ms
            - script.execute: light_alert_high
      - if:
          condition:
            lambda: 'return id(pending_mode) == 1;'
          then:
            - logger.log: "Preview: battery-mode pattern (sample n=3)"
            - script.execute:
                id: battery_alert_seq
                n: 3

  # ---------------------------------------------------------
  # ยืนยันการเปลี่ยนโหมดจริง (commit pending_mode → relay_mode)
  # แล้วเล่นสัญญาณ "ยืนยันแล้ว" ซึ่งเป็นรูปแบบเฉพาะที่ไม่ซ้ำกับสัญญาณ
  # อื่นใดในระบบ (relay ทั้ง 6 ตัวติด-ดับพร้อมกัน 3 รอบ)
  # ---------------------------------------------------------
  - id: confirm_mode_change
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(pending_mode) != -1 && id(pending_mode) != id(relay_mode);'
          then:
            - lambda: 'id(relay_mode) = id(pending_mode);'
            - logger.log: "Relay alert mode changed and confirmed"
            - script.execute: mode_confirmed_signal
          else:
            - logger.log: "No mode change to confirm (same mode or nothing selected)"

  - id: mode_confirmed_signal
    mode: restart
    then:
      - repeat:
          count: 3
          then:
            - switch.turn_on: relay_1
            - switch.turn_on: relay_2
            - switch.turn_on: relay_3
            - switch.turn_on: relay_4
            - switch.turn_on: relay_5
            - switch.turn_on: relay_6
            - delay: 100ms
            - switch.turn_off: relay_1
            - switch.turn_off: relay_2
            - switch.turn_off: relay_3
            - switch.turn_off: relay_4
            - switch.turn_off: relay_5
            - switch.turn_off: relay_6
            - delay: 100ms

# =========================================================
# FIREBASE รอบเวลา — latest ทุก ${latest_interval}, history ทุก
# ${history_interval} (ตั้งค่าใน substitutions ด้านบน) ทั้งคู่ใช้ snapshot
# รูปแบบเดียวกัน และจะไม่ส่งจนกว่าเวลา SNTP จะ sync แล้ว
#
# หมายเหตุ: Firebase REST (บอร์ดยิงข้อมูลเข้าไปฝ่ายเดียว) ไม่มีกลไกแบบ
# MQTT will-message — ฝั่งที่อ่าน latest ต้องดูว่า "timestamp" ค้างนาน
# เกิน ~2 รอบ (เช่น > 90 วินาที) แล้วสรุปเองว่าบอร์ดออฟไลน์
# =========================================================
interval:
  - interval: ${latest_interval}
    then:
      - script.execute: firebase_push_latest
  - interval: ${history_interval}
    then:
      - script.execute: firebase_push_history