# =========================================================
# แสดงโหมดที่ใช้งานอยู่ + สถานะการทำงานของเซนเซอร์แต่ละตัวบน dashboard
# (ข้อกำหนดที่ 4) — text_sensor พวกนี้ยังถูก ESPHome publish ออก MQTT
# เป็นค่า default ให้อัตโนมัติเหมือน entity อื่น ๆ (topic เดิม ไม่กระทบ
# ของเก่า) จึงต่อเข้า Node-RED/HA เพิ่มได้เลยในอนาคตโดยไม่ต้องแก้ yaml อีก
# =========================================================
text_sensor:
  - platform: template
    name: "AC209 Active Relay Mode"
    id: active_mode_text
    lambda: |-
      if (id(relay_mode) == 0) {
        return {"Light-based (BH1750)"};
      } else {
        return {"Battery-based (Mijia)"};
      }
    update_interval: 5s

  # ใหม่: สถานะสุขภาพของเซนเซอร์แสง BH1750 — ให้ดูรู้ทันทีว่าตอนนี้ค่า
  # แสงที่เห็นเชื่อถือได้หรือเป็นค่าสุ่มจากเซนเซอร์ที่ยังไม่ได้ติดตั้ง
  - platform: template
    name: "AC209 Light Sensor Status"
    id: light_status_text
    lambda: |-
      if (id(light_unstable_streak) >= 3) {
        return {"ไม่พบเซนเซอร์ / ค่าผิดปกติ (ยังไม่ได้ติดตั้ง?)"};
      }
      return {"ทำงานปกติ"};
    update_interval: 5s

  # ใหม่: สถานะออนไลน์/ออฟไลน์ของ Mijia แต่ละตัว (1-10) โดยเช็คจากเวลา
  # ที่ได้รับสัญญาณ BLE ล่าสุด — ถ้าเกิน 5 นาทีไม่มีสัญญาณเข้ามาเลยถือว่า
  # "ออฟไลน์" ถ้ายังไม่เคยได้รับสัญญาณเลยตั้งแต่บอร์ดบูตถือว่า "ยังไม่พบ
  # สัญญาณ" (มีประโยชน์มากตอนนี้ที่ยังติดตั้งเซนเซอร์ไม่ครบ 10 ตัว)
  - platform: template
    name: "Mijia 1 Status"
    id: mijia_1_status
    lambda: |-
      uint32_t last = id(mijia_last_seen)[0];
      if (last == 0) return {"ยังไม่พบสัญญาณ"};
      if (millis() - last > 300000) return {"ออฟไลน์"};
      return {"ออนไลน์"};
    update_interval: 15s

  - platform: template
    name: "Mijia 2 Status"
    id: mijia_2_status
